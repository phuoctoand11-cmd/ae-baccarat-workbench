[project]
name = "ae-baccarat-workbench"
version = "0.1.0"
description = "Desktop Windows workbench for AE SEXY Baccarat live monitoring, signals, and paper trading."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = [
  "playwright>=1.46",
  "websockets>=12",
]
analytics = [
  "duckdb>=1.1",
]
ml = [
  "duckdb>=1.1",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "joblib>=1.3",
]
package = [
  "pyinstaller>=6.0",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
ae-baccarat-workbench = "ae_baccarat_workbench.app:main"
ae-baccarat-train-ml = "ae_baccarat_workbench.ml:main"

[tool.setuptools.packages.find]
include = ["ae_baccarat_workbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
